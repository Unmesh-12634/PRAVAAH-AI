name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall gee backend ml scripts 2>/dev/null || true
